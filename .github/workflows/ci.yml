name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read Emacs version
        id: emacs-version
        run: echo "version=$(tr -d '[:space:]' < .emacs-version)" >> "$GITHUB_OUTPUT"
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ steps.emacs-version.outputs.version }}
      - name: Start Emacs server
        run: emacs --daemon=folio-ci
      - name: Run checks
        run: ./scripts/check-all.sh
        env:
          FOLIO_EMACS_SERVER: folio-ci
